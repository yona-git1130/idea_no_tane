# RenderでBackendをデプロイするための設定(Blueprint)。
# Renderのダッシュボードで「New +」→「Blueprint」からこのリポジトリを選ぶと、
# この内容をもとにサービスが自動作成される。
# sync: false の項目は秘密情報なので、Render側の画面で値を入力する(このファイルには書かない)。
services:
  - type: web
    name: ideaboard-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_ORIGIN
        sync: false
