<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>福岡市の天気予報</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #e8f7fc;
    --panel: #ffffff;
    --text: #14424f;
    --muted: #5b93a3;
    --accent: #29b6d8;
    --border: #cdeef7;
    --danger: #f4756b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f2530;
      --panel: #16323f;
      --text: #e3f6fc;
      --muted: #7fb3c2;
      --accent: #4fd1ea;
      --border: #234957;
      --danger: #f4938b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 20px;
    color: var(--accent);
  }
  .card-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .card .date {
    font-weight: bold;
    font-size: 15px;
    margin-bottom: 6px;
  }
  .card .weather {
    margin: 0 0 10px;
    line-height: 1.5;
  }
  .card .meta {
    display: flex;
    gap: 16px;
    font-size: 13px;
    color: var(--muted);
  }
  .status {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
  }
  .status.error {
    color: var(--danger);
  }
</style>
</head>
<body>
<div class="app">
  <h1>福岡市の天気予報</h1>
  <div id="content" class="status">読み込み中...</div>
</div>

<script>
  const FORECAST_URL = "https://www.jma.go.jp/bosai/forecast/data/forecast/400000.json";
  const FUKUOKA_DISTRICT_CODE = "400010"; // 福岡地方(福岡市を含む)
  const FUKUOKA_CITY_CODE = "82182";      // 気温の代表地点: 福岡

  function findArea(timeSeriesEntry, code) {
    return timeSeriesEntry.areas.find((a) => a.area.code === code);
  }

  function groupByDate(dates, values) {
    const grouped = {};
    dates.forEach((date, i) => {
      const value = values[i];
      if (!value) return;
      const day = date.slice(0, 10);
      (grouped[day] ||= []).push(value);
    });
    return grouped;
  }

  function extractWeather(forecast) {
    const ts = forecast.timeSeries;

    const weatherArea = findArea(ts[0], FUKUOKA_DISTRICT_CODE);
    const weatherDates = ts[0].timeDefines;
    const weathers = weatherArea.weathers;

    const popArea = findArea(ts[1], FUKUOKA_DISTRICT_CODE);
    const popByDay = groupByDate(ts[1].timeDefines, popArea.pops);

    const tempArea = findArea(ts[2], FUKUOKA_CITY_CODE);
    const tempByDay = groupByDate(ts[2].timeDefines, tempArea.temps);

    return weatherDates.map((date, i) => {
      const day = date.slice(0, 10);
      return {
        date: day,
        weather: weathers[i],
        pops: popByDay[day] || [],
        temps: tempByDay[day] || [],
      };
    });
  }

  function render(forecasts) {
    const content = document.getElementById("content");
    content.className = "";
    content.innerHTML = '<div class="card-list">' +
      forecasts.map((item) => `
        <div class="card">
          <div class="date">${item.date}</div>
          <p class="weather">${item.weather}</p>
          <div class="meta">
            <span>降水確率: ${item.pops.length ? item.pops.join(" / ") + "%" : "-"}</span>
            <span>気温: ${item.temps.length ? item.temps.join(" / ") + "℃" : "-"}</span>
          </div>
        </div>
      `).join("") +
      "</div>";
  }

  async function main() {
    const content = document.getElementById("content");
    try {
      const res = await fetch(FORECAST_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const forecasts = extractWeather(data[0]); // 短期予報(3日分)
      render(forecasts);
    } catch (err) {
      content.className = "status error";
      content.textContent = `天気予報の取得に失敗しました: ${err.message}`;
    }
  }

  main();
</script>
</body>
</html>
